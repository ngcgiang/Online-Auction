<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Chủ - Danh Sách Đấu Giá</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 50px auto;
      padding: 20px;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .product-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      transition: all 0.3s ease;
    }
    .product-card:hover {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .product-card.price-updated {
      border-color: #4caf50;
      animation: priceFlash 0.5s ease-in-out;
    }
    @keyframes priceFlash {
      0%, 100% { background: white; }
      50% { background: #e8f5e9; }
    }
    .product-image {
      width: 100%;
      height: 180px;
      background: #f0f0f0;
      border-radius: 5px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #999;
    }
    .product-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .product-price {
      font-size: 20px;
      color: #e74c3c;
      font-weight: bold;
      margin: 8px 0;
    }
    .product-winner {
      font-size: 14px;
      color: #666;
      margin: 5px 0;
    }
    .price-badge {
      display: inline-block;
      background: #ff9800;
      color: white;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      margin-left: 5px;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 3px;
      font-size: 12px;
      margin-bottom: 20px;
    }
    .connected {
      background: #4caf50;
      color: white;
    }
    .disconnected {
      background: #e74c3c;
      color: white;
    }
    .update-log {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 15px;
      border-radius: 5px;
      max-width: 300px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
      z-index: 1000;
    }
    .log-entry {
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }
  </style>
</head>
<body>
  <h1>Danh Sách Sản Phẩm Đấu Giá</h1>
  
  <!-- Connection Status -->
  <div>
    Trạng thái kết nối: <span id="connectionStatus" class="status disconnected">Đang kết nối...</span>
  </div>

  <!-- Product Grid -->
  <div id="productGrid" class="product-grid">
    <!-- Products will be rendered here -->
  </div>

  <!-- Update Log (for debugging) -->
  <div class="update-log" id="updateLog">
    <strong>📊 Cập nhật realtime:</strong>
    <div id="logEntries"></div>
  </div>

  <!-- Socket.io Client Library -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  
  <script>
    // ========================================
    // PHẦN 1: KHỞI TẠO SOCKET.IO CLIENT
    // ========================================
    const SOCKET_SERVER = 'http://localhost:3000'; // TODO: Thay đổi theo môi trường

    // Kết nối Socket.io
    const socket = io(SOCKET_SERVER, {
      transports: ['websocket', 'polling'],
      reconnection: true,
      reconnectionDelay: 1000,
      reconnectionAttempts: 5
    });

    // Danh sách sản phẩm hiện tại trên trang (được load từ API)
    let currentProducts = {};

    // ========================================
    // PHẦN 2: XỬ LÝ KẾT NỐI
    // ========================================
    socket.on('connect', () => {
      console.log('✅ Connected to Socket.io server:', socket.id);
      updateConnectionStatus(true);
      
      // Join homepage feed room
      socket.emit('join_homepage');
    });

    socket.on('disconnect', () => {
      console.log('❌ Disconnected from Socket.io server');
      updateConnectionStatus(false);
    });

    socket.on('room_joined', (data) => {
      console.log('🎉 Joined room:', data);
    });

    socket.on('connect_error', (error) => {
      console.error('⚠️ Connection error:', error);
      updateConnectionStatus(false);
    });

    // ========================================
    // PHẦN 3: LẮNG NGHE UPDATE REALTIME (MINIMAL DATA)
    // ========================================
    /**
     * Lắng nghe sự kiện update_price_list (MINIMAL DATA)
     * Dữ liệu nhận được:
     * {
     *   productId: 123,
     *   currentPrice: 5500000,
     *   winnerFullName: '****_doe',
     *   timestamp: '2025-11-26T09:50:00Z'
     * }
     */
    socket.on('update_price_list', (data) => {
      console.log('📡 Received minimal update:', data);
      addLogEntry(`Sản phẩm #${data.productId}: ${formatCurrency(data.currentPrice)}`);
      
      // ✅ LOGIC QUAN TRỌNG: Chỉ cập nhật nếu sản phẩm có trong danh sách hiện tại
      if (currentProducts[data.productId]) {
        updateProductInList(data);
      } else {
        console.log(`⏭️ Product #${data.productId} not in current list, skipping update`);
      }
    });

    // ========================================
    // PHẦN 4: CẬP NHẬT GIAO DIỆN
    // ========================================
    /**
     * Cập nhật giá sản phẩm trong danh sách
     */
    function updateProductInList(data) {
      const productCard = document.getElementById(`product-${data.productId}`);
      if (!productCard) {
        console.warn(`⚠️ Product card #${data.productId} not found in DOM`);
        return;
      }

      // Cập nhật dữ liệu trong memory
      currentProducts[data.productId].currentPrice = data.currentPrice;
      currentProducts[data.productId].winnerFullName = data.winnerFullName;

      // Thêm hiệu ứng nhấp nháy (highlight)
      productCard.classList.add('price-updated');
      setTimeout(() => {
        productCard.classList.remove('price-updated');
      }, 500);

      // Cập nhật giá hiển thị
      const priceElement = productCard.querySelector('.product-price');
      priceElement.innerHTML = `
        ${formatCurrency(data.currentPrice)}
        <span class="price-badge">MỚI</span>
      `;

      // Xóa badge "MỚI" sau 2 giây
      setTimeout(() => {
        const badge = priceElement.querySelector('.price-badge');
        if (badge) badge.remove();
      }, 2000);

      // Cập nhật người thắng
      const winnerElement = productCard.querySelector('.product-winner');
      if (winnerElement) {
        winnerElement.textContent = `Người thắng: ${data.winnerFullName || 'N/A'}`;
      }
    }

    /**
     * Render danh sách sản phẩm ban đầu
     */
    function renderProductList(products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      products.forEach(product => {
        currentProducts[product.productId] = product;

        const card = document.createElement('div');
        card.className = 'product-card';
        card.id = `product-${product.productId}`;
        
        // Hiển thị ảnh sản phẩm nếu có
        const imageHtml = product.avatar 
          ? `<img src="${product.avatar}" alt="${product.name}" style="width:100%;height:180px;object-fit:cover;border-radius:5px;margin-bottom:10px;">` 
          : `<div class="product-image">[Ảnh sản phẩm]</div>`;
        
        card.innerHTML = `
          ${imageHtml}
          <div class="product-name">${product.name}</div>
          <div class="product-price">${formatCurrency(product.currentPrice)}</div>
          <div class="product-winner">Người thắng: ${product.winnerFullName || 'Chưa có'}</div>
          <button onclick="viewDetail(${product.productId})">Xem chi tiết</button>
        `;
        
        grid.appendChild(card);
      });

      console.log('✅ Rendered', products.length, 'products');
    }

    /**
     * Cập nhật trạng thái kết nối
     */
    function updateConnectionStatus(isConnected) {
      const statusElement = document.getElementById('connectionStatus');
      if (isConnected) {
        statusElement.textContent = 'Đã kết nối';
        statusElement.className = 'status connected';
      } else {
        statusElement.textContent = 'Mất kết nối';
        statusElement.className = 'status disconnected';
      }
    }

    /**
     * Thêm log entry (cho debugging)
     */
    function addLogEntry(message) {
      const logContainer = document.getElementById('logEntries');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.textContent = `${new Date().toLocaleTimeString()}: ${message}`;
      logContainer.insertBefore(entry, logContainer.firstChild);

      // Giới hạn số log entries
      if (logContainer.children.length > 10) {
        logContainer.removeChild(logContainer.lastChild);
      }
    }

    /**
     * Format số tiền
     */
    function formatCurrency(amount) {
      return new Intl.NumberFormat('vi-VN', {
        style: 'currency',
        currency: 'VND'
      }).format(amount);
    }

    /**
     * Xem chi tiết sản phẩm
     */
    function viewDetail(productId) {
      window.location.href = `/product/${productId}`;
    }

    // ========================================
    // PHẦN 5: CLEANUP KHI RỜI TRANG
    // ========================================
    window.addEventListener('beforeunload', () => {
      socket.emit('leave_homepage');
      socket.disconnect();
    });

    // ========================================
    // PHẦN 6: LOAD DỮ LIỆU BAN ĐẦU
    // ========================================
    window.addEventListener('DOMContentLoaded', async () => {
      console.log('📄 Page loaded, fetching initial data...');
      
      try {
        // Fetch danh sách sản phẩm từ API
        const response = await fetch('http://localhost:3000/api/products?page=2&pageSize=12');
        const result = await response.json();
        
        if (result.success && result.data) {
          // Transform API data to match expected format
          const products = result.data.map(product => ({
            productId: product.product_id,
            name: product.product_name,
            currentPrice: parseFloat(product.current_price),
            winnerFullName: product.highestBidder ? product.highestBidder.full_name : null,
            avatar: product.avatar
          }));
          
          renderProductList(products);
          addLogEntry(`Đã tải ${products.length} sản phẩm`);
        } else {
          console.error('Failed to load products:', result);
          addLogEntry('Lỗi tải dữ liệu');
        }
      } catch (error) {
        console.error('Error fetching products:', error);
        addLogEntry('Lỗi kết nối API');
      }
    });
  </script>
</body>
</html>
