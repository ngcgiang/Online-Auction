<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi Tiết Sản Phẩm - Đấu Giá Realtime</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .product-detail {
      border: 2px solid #ddd;
      padding: 20px;
      border-radius: 8px;
    }
    .price-section {
      background: #f5f5f5;
      padding: 15px;
      margin: 15px 0;
      border-radius: 5px;
      transition: background 0.3s ease;
    }
    .price-section.highlight {
      background: #fff3cd;
      animation: pulse 0.5s ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .current-price {
      font-size: 32px;
      font-weight: bold;
      color: #e74c3c;
    }
    .winner-info {
      margin: 10px 0;
      padding: 10px;
      background: #e8f5e9;
      border-left: 4px solid #4caf50;
    }
    .timer {
      font-size: 20px;
      color: #ff6b6b;
      font-weight: bold;
    }
    .bid-history {
      margin-top: 20px;
    }
    .bid-item {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }
    .bid-item.refused {
      text-decoration: line-through;
      opacity: 0.5;
      background: #ffebee;
    }
    .bid-status {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 11px;
      margin-left: 5px;
    }
    .bid-status.valid {
      background: #4caf50;
      color: white;
    }
    .bid-status.invalid {
      background: #e74c3c;
      color: white;
    }
    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 3px;
      font-size: 12px;
      margin-left: 10px;
    }
    .connected {
      background: #4caf50;
      color: white;
    }
    .disconnected {
      background: #e74c3c;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Chi Tiết Sản Phẩm Đấu Giá</h1>
  
  <!-- Connection Status -->
  <div>
    Trạng thái kết nối: <span id="connectionStatus" class="status disconnected">Đang kết nối...</span>
  </div>

  <div class="product-detail">
    <h2 id="productName">Sản Phẩm #<span id="productId">123</span></h2>
    
    <!-- Price Section -->
    <div id="priceSection" class="price-section">
      <div>
        <span>Giá hiện tại:</span>
        <div class="current-price" id="currentPrice">5,000,000 đ</div>
      </div>
      
      <!-- Winner Info -->
      <div class="winner-info" id="winnerInfo">
        <strong>Người đang thắng:</strong> 
        <span id="winnerFullName">****_user</span> 
        (Điểm: <span id="winnerRating">4.5</span>⭐)
      </div>
      
      <!-- Remaining Time -->
      <div>
        <strong>Thời gian còn lại:</strong> 
        <span class="timer" id="remainingTime">Loading...</span>
      </div>
      
      <!-- Bid Count -->
      <div>
        <strong>Số lượt đặt giá:</strong> 
        <span id="bidCount">0</span>
      </div>
    </div>

    <!-- Bid History -->
    <div class="bid-history">
      <h3>Lịch Sử Đấu Giá</h3>
      <div id="bidHistoryList">
        <p>Đang tải lịch sử...</p>
      </div>
    </div>
  </div>

  <!-- Socket.io Client Library -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  
  <script>
    // ========================================
    // PHẦN 1: KHỞI TẠO SOCKET.IO CLIENT
    // ========================================
    // Get product ID from URL
    const urlParts = window.location.pathname.split('/');
    const PRODUCT_ID = parseInt(urlParts[urlParts.length - 1]) ||10;
    const SOCKET_SERVER = 'http://localhost:3000'; // TODO: Thay đổi theo môi trường

    // Kết nối Socket.io
    const socket = io(SOCKET_SERVER, {
      transports: ['websocket', 'polling'],
      reconnection: true,
      reconnectionDelay: 1000,
      reconnectionAttempts: 5
    });

    // ========================================
    // PHẦN 2: XỬ LÝ KẾT NỐI
    // ========================================
    socket.on('connect', () => {
      console.log('✅ Connected to Socket.io server:', socket.id);
      updateConnectionStatus(true);
      
      // Join room product detail
      socket.emit('join_product_room', { productId: PRODUCT_ID });
    });

    socket.on('disconnect', () => {
      console.log('❌ Disconnected from Socket.io server');
      updateConnectionStatus(false);
    });

    socket.on('room_joined', (data) => {
      console.log('🎉 Joined room:', data);
    });

    socket.on('connect_error', (error) => {
      console.error('⚠️ Connection error:', error);
      updateConnectionStatus(false);
    });

    // ========================================
    // PHẦN 3: LẮNG NGHE UPDATE REALTIME
    // ========================================
    /**
     * Lắng nghe sự kiện update_price_detail (FULL DATA)
     * Dữ liệu nhận được:
     * {
     *   productId: 123,
     *   currentPrice: 5500000,
     *   winner: { userId: 45, full_name: '****_doe', ratingScore: 4.5 },
     *   bidCount: 15,
     *   remainingTime: 600000 (ms),
     *   endTime: '2025-11-26T10:00:00Z',
     *   timestamp: '2025-11-26T09:50:00Z'
     * }
     */
    socket.on('update_price_detail', (data) => {
      console.log('📡 Received realtime update:', data);
      
      // Kiểm tra xem có đúng sản phẩm không
      if (data.productId !== PRODUCT_ID) {
        console.warn('⚠️ Received update for different product');
        return;
      }

      // Cập nhật giao diện
      updateProductDetail(data);
    });

    /**
     * 🆕 Lắng nghe sự kiện bid_history_update (BID HISTORY)
     * Dữ liệu nhận được:
     * {
     *   productId: 123,
     *   bids: [{ bid_id, amount, bidder, status, bid_time }, ...],
     *   timestamp: '2025-11-29T10:00:00Z'
     * }
     */
    socket.on('bid_history_update', (data) => {
      console.log('📡 Received bid history update:', data);
      
      if (data.productId !== PRODUCT_ID) {
        console.warn('⚠️ Received bid history for different product');
        return;
      }

      // Update bid history UI with status field
      updateBidHistoryUI(data.bids);
    });

    // ========================================
    // PHẦN 4: CÁC HÀM CẬP NHẬT GIAO DIỆN
    // ========================================
    /**
     * Cập nhật thông tin sản phẩm khi nhận được dữ liệu realtime
     */
    function updateProductDetail(data) {
      // Highlight price section khi có thay đổi
      const priceSection = document.getElementById('priceSection');
      priceSection.classList.add('highlight');
      setTimeout(() => {
        priceSection.classList.remove('highlight');
      }, 500);

      // Cập nhật giá
      const priceElement = document.getElementById('currentPrice');
      priceElement.textContent = formatCurrency(data.currentPrice);

      // Cập nhật thông tin người thắng
      if (data.winner) {
        document.getElementById('winnerFullName').textContent = data.winner.full_name;
        document.getElementById('winnerRating').textContent = data.winner.ratingScore.toFixed(1);
      } else {
        document.getElementById('winnerFullName').textContent = 'Chưa có';
        document.getElementById('winnerRating').textContent = 'N/A';
      }

      // Cập nhật số lượt đặt giá
      if (data.bidCount !== null) {
        document.getElementById('bidCount').textContent = data.bidCount;
      }

      // Cập nhật thời gian còn lại nếu endTime thay đổi (auto extend)
      if (data.endTime) {
        auctionEndTime = new Date(data.endTime);
      }
      
      // Update remaining time immediately
      if (data.remainingTime !== undefined) {
        updateRemainingTime(data.remainingTime);
      }

      // Optional: Cập nhật lịch sử (có thể gọi API hoặc socket emit để lấy)
      // fetchBidHistory();
    }

    /**
     * Cập nhật trạng thái kết nối
     */
    function updateConnectionStatus(isConnected) {
      const statusElement = document.getElementById('connectionStatus');
      if (isConnected) {
        statusElement.textContent = 'Đã kết nối';
        statusElement.className = 'status connected';
      } else {
        statusElement.textContent = 'Mất kết nối';
        statusElement.className = 'status disconnected';
      }
    }

    /**
     * Cập nhật thời gian còn lại
     */
    function updateRemainingTime(remainingMs) {
      const timerElement = document.getElementById('remainingTime');
      
      if (remainingMs <= 0) {
        timerElement.textContent = 'ĐÃ KẾT THÚC';
        timerElement.style.color = '#888';
        return;
      }

      const seconds = Math.floor((remainingMs / 1000) % 60);
      const minutes = Math.floor((remainingMs / (1000 * 60)) % 60);
      const hours = Math.floor((remainingMs / (1000 * 60 * 60)) % 24);
      const days = Math.floor(remainingMs / (1000 * 60 * 60 * 24));

      let timeString = '';
      if (days > 0) timeString += `${days} ngày `;
      if (hours > 0) timeString += `${hours} giờ `;
      if (minutes > 0) timeString += `${minutes} phút `;
      timeString += `${seconds} giây`;

      timerElement.textContent = timeString;

      // Cảnh báo nếu còn dưới 5 phút
      if (remainingMs < 5 * 60 * 1000) {
        timerElement.style.color = '#ff0000';
      } else if (remainingMs < 30 * 60 * 1000) {
        timerElement.style.color = '#ff9800';
      }
    }

    /**
     * 🆕 Update bid history UI with status field support
     * @param {Array} bids - Array of bid objects with status field
     */
    function updateBidHistoryUI(bids) {
      const historyContainer = document.getElementById('bidHistoryList');
      
      if (!bids || bids.length === 0) {
        historyContainer.innerHTML = '<p>Chưa có lượt đấu giá nào</p>';
        return;
      }
      
      historyContainer.innerHTML = bids.map(bid => {
        const isRefused = bid.status === 0;
        const itemClass = isRefused ? 'bid-item refused' : 'bid-item';
        const statusBadge = isRefused 
          ? '<span class="bid-status invalid">ĐÃ TỪ CHỐI</span>' 
          : '<span class="bid-status valid">HỢP LỆ</span>';
        
        return `
          <div class="${itemClass}">
            <strong>${bid.bidder.full_name}</strong> đã đặt giá 
            <strong style="color: ${isRefused ? '#999' : '#e74c3c'};">${formatCurrency(bid.amount)}</strong>
            ${statusBadge}
            <br>
            <small style="color: #999;">${new Date(bid.bid_time).toLocaleString('vi-VN')}</small>
          </div>
        `;
      }).join('');
      
      // Add animation effect
      historyContainer.style.animation = 'pulse 0.3s ease-in-out';
      setTimeout(() => {
        historyContainer.style.animation = '';
      }, 300);
    }

    /**
     * Format số tiền
     */
    function formatCurrency(amount) {
      return new Intl.NumberFormat('vi-VN', {
        style: 'currency',
        currency: 'VND'
      }).format(amount);
    }

    // ========================================
    // PHẦN 5: CLEANUP KHI RỜI TRANG
    // ========================================
    window.addEventListener('beforeunload', () => {
      if (countdownInterval) {
        clearInterval(countdownInterval);
      }
      socket.emit('leave_product_room', { productId: PRODUCT_ID });
      socket.disconnect();
    });

    // ========================================
    // DEMO: Load dữ liệu ban đầu từ API
    // ========================================
    let countdownInterval = null;
    let auctionEndTime = null;
    
    window.addEventListener('DOMContentLoaded', async () => {
      console.log('📄 Page loaded, loading product details...');
      
      // Update product ID display
      document.getElementById('productId').textContent = PRODUCT_ID;
      try {
        // Fetch product details from API
        const response = await fetch(`http://localhost:3000/api/products/${PRODUCT_ID}/details`);
        const result = await response.json();
        
        if (result.success && result.data) {
          const product = result.data;
          
          // Update product name
          document.getElementById('productName').innerHTML = `${product.product_name} <small>#${PRODUCT_ID}</small>`;
          
          // Store end time for countdown
          auctionEndTime = new Date(product.end_time);
          const remainingMs = auctionEndTime.getTime() - Date.now();
          
          // Update initial data
          updateProductDetail({
            productId: PRODUCT_ID,
            currentPrice: parseFloat(product.current_price),
            winner: product.highestBidder ? {
              userId: product.highestBidder.user_id,
              full_name: product.highestBidder.full_name,
              ratingScore: product.highestBidder.rating_score || 0
            } : null,
            bidCount: product.bidCount || 0,
            remainingTime: remainingMs,
            endTime: product.end_time
          });
          
          // Start countdown timer
          startCountdown();
          
          // Load bid history
          await loadBidHistory(PRODUCT_ID);
          
          console.log('✅ Product details loaded');
        } else {
          console.error('Failed to load product:', result);
          alert('Không thể tải thông tin sản phẩm');
        }
      } catch (error) {
        console.error('Error fetching product details:', error);
        alert('Lỗi kết nối API');
      }
    });
    
    /**
     * Start countdown timer that updates every second
     */
    function startCountdown() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
      }
      
      countdownInterval = setInterval(() => {
        if (!auctionEndTime) return;
        
        const remainingMs = auctionEndTime.getTime() - Date.now();
        updateRemainingTime(remainingMs);
        
        if (remainingMs <= 0) {
          clearInterval(countdownInterval);
        }
      }, 1000);
    }
    
    /**
     * Load bid history from API (updated to use mode parameter)
     */
    async function loadBidHistory(productId) {
      try {
        // Fetch latest 5 bids with mode=all (shows both valid and refused)
        const response = await fetch(`http://localhost:3000/api/bids/history/${productId}?mode=all`);
        const result = await response.json();
        
        if (result.success && result.data) {
          updateBidHistoryUI(result.data);
        }
      } catch (error) {
        console.error('Error loading bid history:', error);
      }
    }
  </script>
</body>
</html>
