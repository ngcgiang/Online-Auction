  # ==================== BIDS ====================
  /api/bids:
    post:
      tags:
        - Bids
      summary: Đặt giá (Place Bid)
      description: |
        Đặt giá cho sản phẩm đấu giá với **Proxy Bidding**.
        
        **Proxy Bidding Logic:**
        - User đặt max_bid (số tiền tối đa sẵn sàng trả)
        - System tự động bid incrementally cho đến khi:
          - Đạt max_bid của user
          - Hoặc vượt max_bid của người khác
        - Current_price chỉ tăng theo price_step
        
        **Auto Time Extension:**
        - Nếu có bid trong 5 phút cuối → Gia hạn thêm 10 phút
        - Chỉ áp dụng khi auto_renewal = true
        
        **Realtime Update:**
        - Sau khi bid thành công, system emit qua Socket.io:
          - Room `product_{id}`: Full data (cho product detail page)
          - Room `homepage_feed`: Minimal data (cho homepage list)
      operationId: placeBid
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBidRequest'
      responses:
        '201':
          description: Đặt giá thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Bid placed successfully"
                  data:
                    type: object
                    properties:
                      bid:
                        $ref: '#/components/schemas/Bid'
                      isWinning:
                        type: boolean
                        example: true
                        description: "User hiện tại có đang thắng không"
                      currentPrice:
                        type: number
                        example: 26000000
                      highestBidderId:
                        type: integer
                        example: 25
        '400':
          description: |
            Lỗi nghiệp vụ:
            - Giá bid không hợp lệ
            - Sản phẩm đã kết thúc
            - User bị refuse
            - User là seller của sản phẩm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/bids/history/{productId}:
    get:
      tags:
        - Bids
      summary: Lấy lịch sử đấu giá
      description: |
        Lấy lịch sử các lượt bid của sản phẩm (tối đa 5 bids gần nhất).
        
        **Mode:**
        - `valid`: Chỉ lấy bid có status=1 (active)
        - `all`: Lấy cả valid và invalid bids (default)
        
        **Username Masking:**
        - Tên bidder bị che nửa đầu (VD: `john_doe` → `****_doe`)
      operationId: getBidHistory
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: integer
            example: 101
        - name: mode
          in: query
          description: Filter mode
          schema:
            type: string
            enum: [valid, all]
            default: all
      responses:
        '200':
          description: Lịch sử bid
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  mode:
                    type: string
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BidHistory'

  /api/bids/user/{userId}/product/{productId}:
