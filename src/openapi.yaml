    post:
      tags:
        - Products
      summary: Từ chối bidder đặt giá
      description: |
        Seller từ chối một bidder cụ thể không được đặt giá cho sản phẩm này.
        
        **Lưu ý:**
        - Chỉ seller (owner) có quyền
        - Bidder bị refuse sẽ không thể đặt giá trên sản phẩm này nữa
      operationId: refuseBidder
      security:
        - bearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bidder_id
              properties:
                bidder_id:
                  type: integer
                  example: 25
      responses:
        '201':
          description: Từ chối bidder thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Không có quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/products/{product_id}/refused-bidders:
    get:
      tags:
