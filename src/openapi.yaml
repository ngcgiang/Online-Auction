  /api/products/{product_id}/updates:
    post:
      tags:
        - Products
      summary: Thêm mô tả sản phẩm (Append-only)
      description: |
        Thêm description update mới vào lịch sử mô tả sản phẩm.
        
        **Đặc điểm:**
        - Append-only: Không xóa/sửa description cũ
        - Chỉ seller (owner) mới được thêm
        - HTML được sanitize để chống XSS
        - Tạo audit trail cho mọi thay đổi
      operationId: appendProductDescription
      security:
        - bearerAuth: []
      parameters:
        - name: product_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  example: "Thêm thông tin: Bảo hành quốc tế 24 tháng"
      responses:
        '201':
          description: Thêm description thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      des_id:
                        type: integer
                      product_id:
                        type: integer
                      description:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        '401':
          description: Chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Chỉ owner mới có quyền thêm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Sản phẩm không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

