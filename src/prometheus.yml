# Prometheus Configuration
global:
  scrape_interval: 15s      # Scrape metrics every 15 seconds
  evaluation_interval: 15s  # Evaluate rules every 15 seconds

# Scrape configurations
scrape_configs:
  # Job to scrape Node.js application metrics
  - job_name: 'nodejs-auction-app'
    
    # Use host.docker.internal to reach the host machine from Docker container
    # This allows Prometheus (running in Docker) to scrape metrics from Node.js (running on host)
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: 'auction-api'
          environment: 'development'
    
    metrics_path: '/metrics'
    
    scrape_interval: 10s  # Scrape this job every 10 seconds
    scrape_timeout: 5s    # Timeout after 5 seconds

  # Job to scrape Prometheus itself (optional, useful for monitoring Prometheus)
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
